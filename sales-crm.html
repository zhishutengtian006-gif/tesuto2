function aiErrText(code){
  switch(code){
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      return "このアカウントではClaudeを呼び出せません（許可されていないか、組織の設定で止められています）。";
    case "rate_limited": return "Claudeの利用が混み合っているか、上限に達しました。少し時間をおいて、もう一度押してください。";
    case "session_expired": return "claude.ai へのログインが切れています。ログインし直してから、もう一度押してください。";
    case "prompt_too_large": return "文字起こしが長すぎます。会議の前半と後半に分けて、2回に分けて作ってください。";
    case "invalid_json": return "議事録の形にうまく整えられませんでした。もう一度押してください。";
    case "refused": return "この内容では議事録を作れませんでした。文字起こしの内容をご確認ください。";
    case "empty_completion": return "結果が空でした。文字起こしが短すぎないかご確認ください。";
    case "cancelled": return "中止しました。";
    default: return "Claudeと通信できませんでした。少し時間をおいて、もう一度押してください。";
  }
}
/* 字幕ファイル（.vtt/.srt）の時刻や番号を落として本文だけにする */
function cleanTranscript(t){
  return String(t||"").replace(/\r/g,"").split("\n").filter(l=>{
    const s=l.trim();
    if(!s) return false;
    if(/^WEBVTT/i.test(s) || /^NOTE\b/.test(s)) return false;
    if(/^\d+$/.test(s)) return false;
    if(/^\d{1,2}:\d{2}(:\d{2})?([.,]\d+)?\s*-->/.test(s)) return false;
    return true;
  }).join("\n");
}
function splitText(t, size){
  const out=[]; let rest=t;
  while(rest.length > size){
    let cut = rest.lastIndexOf("\n", size); if(cut < size*0.6) cut = rest.lastIndexOf("。", size)+1; if(cut < size*0.6) cut = size;
    out.push(rest.slice(0,cut)); rest = rest.slice(cut);
  }
  if(rest.trim()) out.push(rest);
  return out;
}
const MIN_SHAPE = '{"summary":"会議全体の要点（2〜4文）","decisions":["決まったこと"],'+
  '"reports":[{"staff":"担当者名","points":["報告の要点（お客様名・工程・金額・次の一手）"]}],'+
  '"actions":[{"title":"やること（何を・誰に）","staff":"担当者名。分からなければ空文字","due":"YYYY-MM-DD。言及が無ければ空文字"}],'+
  '"concerns":["課題・要相談・リスク"]}';
async function aiMinutes(text, date, onStep){
  const dd = parseD(date) || new Date();
  const reps = scopeStaff().map(s=>s.name);
  const names = scopedActive().map(c=>c.name).filter(Boolean).slice(0,150);
  const head = "あなたは住宅会社（"+scopeLabel()+"）の毎週の営業会議の書記です。以下の文字起こしから議事録の材料を抜き出してください。\n"+
    "・会議日は "+date+"（"+WD[dd.getDay()]+"曜日）。「来週金曜まで」などの期限は、この日を基準に日付へ直してください。\n"+
    "・文字起こしは誤変換を含みます。人名は次の一覧に近いものがあれば、その表記にそろえてください。\n"+
    "　営業担当: "+(reps.join("、")||"（なし）")+"\n"+
    "　商談中のお客様: "+(names.join("、")||"（なし）")+"\n"+
    "・雑談や重複は省き、発言に無いことは書かないでください。\n";
  const chunks = splitText(text, 12000);
  const parts = [];
  for(let i=0;i<chunks.length;i++){
    onStep("読み取り中… "+(i+1)+" / "+chunks.length);
    const p = head+"\n# 文字起こし"+(chunks.length>1? "（全"+chunks.length+"部のうち第"+(i+1)+"部）":"")+"\n"+chunks[i]+
      "\n\n# 出力\n次の形のJSONだけを返してください。該当が無い項目は空の配列にします。\n"+MIN_SHAPE;
    try{ parts.push(await SAMPLE.json(p)); }
    catch(e){ if(parts.length) return {partial:true, code:e&&e.code, result:mergeLocal(parts)}; throw e; }
  }
  if(parts.length===1) return {result:parts[0]};
  onStep("全体をまとめています…");
  try{
    const m = await SAMPLE.json("同じ営業会議の文字起こしを分割して抜き出した結果です。重複をまとめ、1つに統合してください。\n\n"+
      JSON.stringify(parts)+"\n\n# 出力\n次の形のJSONだけを返してください。\n"+MIN_SHAPE);
    return {result:m};
  }catch(e){ return {partial:true, code:e&&e.code, result:mergeLocal(parts)}; }
}
function mergeLocal(parts){
  const cat = k => parts.reduce((a,p)=>a.concat(arr(p&&p[k])), []);
  return { summary: parts.map(p=>p&&p.summary).filter(Boolean).join(" "), decisions:cat("decisions"),
    reports:cat("reports"), actions:cat("actions"), concerns:cat("concerns") };
}
function matchStaff(name){
  const n = String(name||"").replace(/[\s　]/g,""); if(!n) return "";
  const reps = scopeStaff();
  const exact = reps.find(s=>String(s.name||"").replace(/[\s　]/g,"")===n); if(exact) return exact.id;
  const part = reps.filter(s=>{ const m=String(s.name||"").replace(/[\s　]/g,""); return m && (m.startsWith(n) || n.startsWith(m) || m.includes(n)); });
  return part.length===1 ? part[0].id : "";
}
function applyMinutes(m){
  const L = [];
  const list = v => arr(v).map(x=>String(x||"").trim()).filter(Boolean);
  if(m.summary) L.push("【要点】", String(m.summary).trim(), "");
  if(list(m.decisions).length) L.push("【決定事項】", ...list(m.decisions).map(x=>"・"+x), "");
  const reps = arr(m.reports).filter(r=>r && list(r.points).length);
  if(reps.length){ L.push("【担当者ごとの報告】"); reps.forEach(r=>{ L.push("■ "+(String(r.staff||"").trim()||"（担当不明）")); list(r.points).forEach(p=>L.push("・"+p)); }); L.push(""); }
  if(list(m.concerns).length) L.push("【課題・要相談】", ...list(m.concerns).map(x=>"・"+x));
  const text = L.join("\n").trim();
  if(text) mtgDraft.notes = mtgDraft.notes.trim() ? mtgDraft.notes.trim()+"\n\n"+text : text;
  arr(m.actions).forEach(a=>{
    const t = a && String(a.title||"").trim(); if(!t) return;
    mtgDraft.actions.push({ title:t, staffId:matchStaff(a.staff), due:/^\d{4}-\d{2}-\d{2}$/.test(String(a.due||""))? a.due : "", todoId:"" });
  });
  mtgDraft.minutes = m;
}

/* 確認・入力ダイアログ（ブラウザの confirm / prompt の代わり） */
let askResolve = null;
function askOpen(o){
  const a=$("#ask");
  a.innerHTML='<div class="scrim" id="askScrim"></div><div class="modal">'+
    '<div class="dhead"><b>'+esc(o.title)+'</b></div>'+
    '<div class="dbody"><p class="amsg">'+esc(o.msg||"")+'</p>'+
    (o.input? '<div style="margin-top:14px"><input id="askInput" type="text" placeholder="'+esc(o.ph||"")+'"></div>':'')+
    '</div><div class="dfoot"><button class="btn '+(o.danger?"danger":"primary")+'" id="askOk">'+esc(o.ok||"OK")+'</button>'+
    '<button class="btn" id="askNo">キャンセル</button></div></div>';
  a.classList.add("on");
  const done = v=>{ a.classList.remove("on"); a.innerHTML=""; document.removeEventListener("keydown",askKey);
    const r=askResolve; askResolve=null; if(r) r(v); };
  a._done = done;
  $("#askScrim").addEventListener("click",()=>done(null));
  $("#askNo").addEventListener("click",()=>done(null));
  $("#askOk").addEventListener("click",()=>done(o.input? ($("#askInput").value||"") : true));
  document.addEventListener("keydown", askKey);
  const f = o.input? $("#askInput") : $("#askOk");
  setTimeout(()=>f&&f.focus(),30);
  if(o.input) $("#askInput").addEventListener("keydown",e=>{ if(e.key==="Enter") done($("#askInput").value||""); });
  return new Promise(r=>{ askResolve=r; });
}
function askKey(e){
  if(e.key!=="Escape") return;
  e.stopPropagation();
  const a=$("#ask"); if(a && a._done) a._done(null);
}
const askConfirm = (title,msg,ok,danger)=> askOpen({title,msg,ok:ok||"実行する",danger});
const askPrompt  = (title,msg,ph,ok)=> askOpen({title,msg,ph,ok:ok||"決定",input:true});

function openOverlay(html){
  const o=$("#overlay");
  o.innerHTML='<div class="scrim" id="scrim"></div>'+html;
  o.classList.add("on");
  $("#scrim").addEventListener("click",closeOverlay);
  bindEyes(o);
  document.addEventListener("keydown", escClose);
  const first=o.querySelector("input,select,textarea,button");
  if(first&&first.focus) setTimeout(()=>first.focus(),30);
}
function escClose(e){
  if(e.key!=="Escape") return;
  const a=$("#ask"); if(a && a.classList.contains("on")) return;
  closeOverlay();
}
function closeOverlay(){
  const o=$("#overlay"); if(!o) return;
  o.classList.remove("on"); o.innerHTML="";
  drawerCust=null;
  document.removeEventListener("keydown", escClose);
  refreshCurrent();
}
try{ const th=localStorage.getItem("crm.theme"); if(th&&th!=="auto") document.documentElement.setAttribute("data-theme",th); }catch(e){}
boot();
</script>
