<title>住宅営業カルテ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface2:#F5F7F8; --surface3:#E7ECEF;
  --border:#D6DEE3; --border-strong:#B9C5CD;
  --text:#141C23; --muted:#5C6E7A; --faint:#8697A2;
  --accent:#1D4E6B; --accent-hover:#16607f; --accent-soft:#DCE9F0; --on-accent:#FFFFFF;
  --rank-a:#A63A2B; --rank-a-bg:#F6E3DF;
  --rank-b:#8A6208; --rank-b-bg:#F6EDD8;
  --rank-c:#55676F; --rank-c-bg:#E6ECEF;
  --ok:#2C6A4C; --ok-bg:#DFEDE5;
  --warn:#9A5B00; --danger:#A02F27; --danger-bg:#F6E1DF;
  --shadow:0 1px 2px rgba(20,28,35,.06), 0 8px 24px -12px rgba(20,28,35,.24);
  --shadow-lg:0 24px 64px -24px rgba(20,28,35,.45);
  --r:6px;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#18212A; --surface2:#1E2833; --surface3:#26323D;
    --border:#2C3945; --border-strong:#42525F;
    --text:#E3EAF0; --muted:#9DAEBB; --faint:#7A8B98;
    --accent:#5FA8CE; --accent-hover:#7CBCDD; --accent-soft:#1C3140; --on-accent:#0B1218;
    --rank-a:#E8917F; --rank-a-bg:#3B2320;
    --rank-b:#DDB65C; --rank-b-bg:#372C16;
    --rank-c:#9FB2BC; --rank-c-bg:#232F37;
    --ok:#78C79C; --ok-bg:#1B2F26;
    --warn:#D9A45B; --danger:#EE9086; --danger-bg:#3A1F1D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 24px 64px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#18212A; --surface2:#1E2833; --surface3:#26323D;
  --border:#2C3945; --border-strong:#42525F;
  --text:#E3EAF0; --muted:#9DAEBB; --faint:#7A8B98;
  --accent:#5FA8CE; --accent-hover:#7CBCDD; --accent-soft:#1C3140; --on-accent:#0B1218;
  --rank-a:#E8917F; --rank-a-bg:#3B2320;
  --rank-b:#DDB65C; --rank-b-bg:#372C16;
  --rank-c:#9FB2BC; --rank-c-bg:#232F37;
  --ok:#78C79C; --ok-bg:#1B2F26;
  --warn:#D9A45B; --danger:#EE9086; --danger-bg:#3A1F1D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 24px 64px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--border-strong);
  background:var(--surface);border-radius:var(--r);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface3)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=time],input[type=number],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px;line-height:1.65}
label.lb{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-family:var(--mono);margin-bottom:4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:100px;font-size:11.5px;font-weight:500;background:var(--surface3);color:var(--muted);white-space:nowrap}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-family:var(--mono);font-weight:500;font-size:12.5px}
.rank.A{background:var(--rank-a-bg);color:var(--rank-a)}
.rank.B{background:var(--rank-b-bg);color:var(--rank-b)}
.rank.C{background:var(--rank-c-bg);color:var(--rank-c)}
.rank.X{background:var(--surface3);color:var(--faint)}
.hr{height:1px;background:var(--border);border:0}
.row{display:flex;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:12.5px} .tiny{font-size:11.5px} .nowrap{white-space:nowrap}

/* ---------- shell ---------- */
#root{min-height:100vh}
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand b{font-size:15px;letter-spacing:.02em}
.brand .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);margin-top:3px;text-transform:uppercase}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);color:var(--muted);text-decoration:none;cursor:pointer;font-size:13.5px;font-weight:500;border:1px solid transparent}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.nav a .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--surface3);color:var(--muted);padding:1px 7px;border-radius:100px}
.nav a.on .n{background:var(--surface);color:var(--accent)}
.nav a .n.alert{background:var(--danger);color:#fff}
.nav .sep{margin:9px 10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.whoami{border-top:1px solid var(--border);padding:11px 12px;display:flex;gap:9px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{padding:13px 22px 11px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg)}
.topbar h1{font-size:19px}
.topbar .vsub{font-size:12px;color:var(--muted);margin-top:1px}
.content{padding:20px 22px 60px;max-width:1560px;width:100%}

/* ---------- scope bar（会社タブ） ---------- */
.scopebar{position:sticky;top:0;z-index:19;display:flex;align-items:center;gap:12px;padding:9px 22px;
  background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap}
.scope-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);flex:none}
.stabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-bottom:1px}
.stab{font-size:13px;font-weight:700;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);
  border-radius:100px;padding:6px 14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.14s}
.stab:hover{border-color:var(--accent);color:var(--accent)}
.stab.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stab .sn{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--surface3);color:var(--muted);padding:0 7px;border-radius:100px}
.stab.on .sn{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}
.lockchip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:100px;background:var(--accent-soft);
  color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.scope-right{display:flex;gap:8px;align-items:center;flex:none}
.scope-right select{width:auto;min-width:132px;padding:6px 9px;font-size:12.5px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px 14px 18px;position:relative;overflow:hidden}
.kpi .kbar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi.a .kbar{background:var(--rank-a)} .kpi.a .v{color:var(--rank-a)}
.kpi.b .kbar{background:var(--rank-b)} .kpi.b .v{color:var(--rank-b)}
.kpi.c .kbar{background:var(--rank-c)} .kpi.c .v{color:var(--rank-c)}
.kpi.warn .kbar{background:var(--danger)} .kpi.warn .v{color:var(--danger)}
.kpi.ok .kbar{background:var(--ok)} .kpi.ok .v{color:var(--ok)}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:29px;font-weight:500;line-height:1.12;margin-top:3px}
.kpi .v .u{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:3px}
.kpi .d{font-size:11px;color:var(--faint);margin-top:1px}

/* ---------- A/B/C レーン ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.board{grid-template-columns:1fr}}
.lane{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.lane-head{padding:13px 15px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--border)}
.lane.a .lane-head{background:var(--rank-a-bg);border-bottom-color:var(--rank-a)}
.lane.b .lane-head{background:var(--rank-b-bg);border-bottom-color:var(--rank-b)}
.lane.c .lane-head{background:var(--rank-c-bg);border-bottom-color:var(--rank-c)}
.lane-badge{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:18px;color:#fff;flex:none}
.lane.a .lane-badge{background:var(--rank-a)} .lane.b .lane-badge{background:var(--rank-b)} .lane.c .lane-badge{background:var(--rank-c)}
.lane-meta .t{font-weight:700;font-size:13px} .lane-meta .d{font-size:11px;color:var(--muted)}
.lane-cnt{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:21px}
.lane-body{padding:9px;display:flex;flex-direction:column;gap:7px;max-height:430px;overflow:auto}
.mini{border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;cursor:pointer;background:var(--surface);transition:.12s}
.mini:hover{border-color:var(--border-strong);background:var(--surface2)}
.mini .mn{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mr{font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center;margin-top:3px;flex-wrap:wrap}
.lane-empty{color:var(--faint);font-size:12px;text-align:center;padding:22px 0}

/* ---------- 次回アポ ピル / ステータス ---------- */
.when{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:100px;border:1px solid transparent;white-space:nowrap}
.when.over{background:var(--danger-bg);color:var(--danger)}
.when.today{background:var(--accent);color:var(--on-accent)}
.when.week{background:var(--rank-b-bg);color:var(--rank-b)}
.when.later{background:var(--surface3);color:var(--muted)}
.when.none{border-color:var(--danger);color:var(--danger)}
.st{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:100px;white-space:nowrap;background:var(--surface3);color:var(--muted)}
.st.active{background:var(--ok-bg);color:var(--ok)}
.st.follow{background:var(--danger-bg);color:var(--danger)}
.st.todo{background:var(--rank-b-bg);color:var(--rank-b)}
.st.contract{background:var(--ok-bg);color:var(--ok)}
.st.lost{background:var(--surface3);color:var(--faint)}

/* ---------- panels / bars / tables ---------- */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.panel>header{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface2)}
.panel>header h3{font-size:13px}
.panel .pad{padding:14px 15px}
.li{display:flex;gap:10px;align-items:center;padding:9px 15px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer} .li.click:hover{background:var(--surface2)}
.empty{padding:26px 15px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.8}
.bars{display:flex;flex-direction:column;gap:9px;padding:14px 15px}
.bar{display:grid;grid-template-columns:104px 1fr 58px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{height:16px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar .val{text-align:right;font-family:var(--mono);font-size:12px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sechead:first-child{margin-top:2px}
.sechead h2{font-size:14px}
.sechead .hint{margin-left:auto;font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface2);text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);font-weight:500;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2}
tbody td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface2)}
td.stripe{border-left:3px solid transparent;padding-left:9px}
tr.rA td.stripe{border-left-color:var(--rank-a)}
tr.rB td.stripe{border-left-color:var(--rank-b)}
tr.rC td.stripe{border-left-color:var(--rank-c)}
.cname{font-weight:500}
.notecell{max-width:340px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sel{width:auto;padding:3px 6px;font-size:12px;font-family:var(--mono);border-radius:5px;border:1px solid var(--border-strong)}

/* ---------- 面談予定 行 ---------- */
.srow{display:flex;gap:13px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--surface2)}
.sdate{flex:none;width:62px;text-align:center}
.sdate .dd{font-family:var(--mono);font-size:17px;font-weight:500;line-height:1.15}
.sdate .dl{font-size:10.5px;color:var(--muted)}
.smain{flex:1;min-width:0}
.smain .sn{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smain .sm{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- カレンダー ---------- */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface2);border-bottom:1px solid var(--border)}
.calhead div{padding:7px 9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);text-align:center}
.calhead div.sun{color:var(--rank-a)} .calhead div.sat{color:var(--accent)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:106px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--surface2)}
.cell.out{background:var(--surface2);opacity:.5}
.cell.today{background:var(--accent-soft)}
.cell .dn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cell.today .dn{color:var(--accent);font-weight:500}
.cell .dn.sun{color:var(--rank-a)} .cell .dn.sat{color:var(--accent)}
.ev{font-size:11px;padding:2px 5px;border-radius:3px;background:var(--surface3);border-left:3px solid var(--accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.ev.mA{border-left-color:var(--rank-a)} .ev.mB{border-left-color:var(--rank-b)} .ev.mC{border-left-color:var(--rank-c)} .ev.mX{border-left-color:var(--faint)}
.ev.done{opacity:.5;text-decoration:line-through}
.ev.other{border-left-color:var(--accent);background:var(--accent-soft)}
.ev.gcal{background:transparent;border:1px dashed var(--border-strong);border-left:3px solid var(--faint);color:var(--muted)}
.gdot{display:inline-block;width:9px;height:9px;border:1px dashed var(--border-strong);border-left:2px solid var(--faint)}

/* ---------- 面談タイムライン ---------- */
.tl{display:flex;flex-direction:column}
.tlnode{position:relative;padding:0 0 16px 20px;border-left:2px solid var(--border);margin-left:6px}
.tlnode:last-child{border-left-color:transparent;padding-bottom:0}
.tldot{position:absolute;left:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong)}
.tldot.done{background:var(--accent);border-color:var(--accent)}
.tldot.sched{border-color:var(--accent)}
.tltop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tlstage{font-weight:700;font-size:13px}
.tldate{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tlnote{font-size:12.5px;margin-top:4px;white-space:pre-wrap;line-height:1.7}
.tlnote.none{color:var(--faint)}
.mblock{border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;background:var(--surface2);margin-bottom:10px}
.mblock .mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mblock .mh .ms{font-weight:700;font-size:12.5px}

/* ---------- drawer / modal ---------- */
#overlay{position:fixed;inset:0;z-index:100;display:none}
#overlay.on{display:block}
#ask{position:fixed;inset:0;z-index:200;display:none}
#ask.on{display:block}
#ask .modal{width:min(440px,calc(100% - 32px))}
#ask .amsg{font-size:13px;color:var(--muted);line-height:1.8;white-space:pre-wrap}
.scrim{position:absolute;inset:0;background:rgba(10,16,21,.44)}
.drawer{position:absolute;top:0;right:0;height:100%;width:min(780px,100%);background:var(--bg);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(16px);opacity:.6}to{transform:none;opacity:1}}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 32px));max-height:88vh;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.dhead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:var(--surface)}
.dbody{overflow:auto;padding:16px 18px;flex:1}

const $ = (s,r)=> (r||document).querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,"0");
const isoDate = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = () => isoDate(new Date());
function parseD(s){ if(!s) return null; const p=String(s).split("-").map(Number); if(p.length<3||!p[0]) return null; const d=new Date(p[0],p[1]-1,p[2]); return isNaN(d)?null:d; }
function fmtD(s){ const d=parseD(s); return d? (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")" : "—"; }
function fmtDY(s){ const d=parseD(s); return d? d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate()) : "—"; }
function daysFrom(s){ const d=parseD(s); if(!d) return null; const t=parseD(TODAY()); return Math.round((d-t)/86400000); }
function num(v){ const n=Number(v); return isFinite(n)?n:0; }
function man(v){ return (v||v===0) && v!=="" ? Number(v).toLocaleString("ja-JP") : "—"; }
const initials = n => (n||"?").trim().slice(0,1);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2400); }
function sortBy(a,f,d){ return a.slice().sort((x,y)=>{const p=f(x),q=f(y); if(p===q) return 0; return (p>q?1:-1)*(d==="desc"?-1:1);}); }
async function sha256(t){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
const hashPw = (s,p)=> sha256(s+":"+p);
/* パスワードの表記ゆれを吸収する：全角→半角（NFKC）、空白、大文字・小文字 */
const normPw = v => String(v==null?"":v).normalize("NFKC").replace(/[\s\u3000]/g,"").toLowerCase();
/* 入力が合っているか。いまの書き方（正規化）と、以前に設定された書き方の両方を試す */
async function pwMatches(a, input){
  if(!a || !a.hash) return false;
  const salt = a.salt||"";
  const raw = String(input==null?"":input);
  for(const c of [...new Set([normPw(raw), raw.trim(), raw])])
    if(await hashPw(salt,c) === a.hash) return true;
  return false;
}

/* ---------- 面談（回数管理） ---------- */
function meetingDone(m){
  const hasNote = !!(m.note||"").trim();
  if(m.date){
    const d = daysFrom(m.date);
    if(d!==null){
      if(d<0) return true;      // 過去日は実施済み
      if(d>0) return false;     // 未来日は必ず予定
      return hasNote;           // 当日はメモの有無で判断
    }
  }
  return hasNote;
}
function meetingsOf(c){ return (c.meetings||[]).map((m,i)=>({...m, idx:i, n:stageName(i)})); }
function stageName(i){ return i===0 ? "初回" : (i+1)+"回目"; }
function scheduledMeeting(c){
  const l = meetingsOf(c).filter(m=>m.date && parseD(m.date) && !meetingDone(m));
  if(!l.length) return null;
  l.sort((a,b)=>a.date.localeCompare(b.date));
  return l[0];
}
function lastDoneMeeting(c){
  const l = meetingsOf(c).filter(meetingDone);
  l.sort((a,b)=> String(b.date||"").localeCompare(String(a.date||"")));
  return l.length? l[0] : null;
}
const nextDate = c => { const m=scheduledMeeting(c); return m? m.date : null; };
const lastContact = c => { const m=lastDoneMeeting(c); return m? m.date : (c.inquiryDate||c.createdAt||"").slice(0,10); };
function statusOf(c){
  if(c.contracted) return {key:"contract", label:"契約済"};
  if(c.lost) return {key:"lost", label:"没"};
  if(!c.rank && !(c.meetings||[]).length) return {key:"todo", label:"情報未入力"};
  if(scheduledMeeting(c)) return {key:"active", label:"商談中"};
  return {key:"follow", label:"次回アポ未設定"};
}
function whenClass(s){
  const d = daysFrom(s);
  if(d===null) return ["",""];
  if(d<0) return ["over","超過"+(-d)+"日"];
  if(d===0) return ["today","本日"];
  if(d<=7) return ["week","あと"+d+"日"];
  const dd = parseD(s);
  return ["later",(dd.getMonth()+1)+"/"+dd.getDate()];
}
function needsFollow(c){
  if(c.contracted||c.lost) return false;
  if(scheduledMeeting(c)) return false;
  const lc = lastContact(c);
  const d = lc? -daysFrom(lc) : null;
  return d===null || d>=FOLLOW_DAYS;
}
function whenPill(c){
  const nd = nextDate(c);
  if(!nd) return '<span class="when none">アポ未設定</span>';
  const m = scheduledMeeting(c);
  const [cls,txt] = whenClass(nd);
  return '<span class="when '+cls+'">'+esc(txt)+(m.time?' '+esc(m.time):'')+'</span>';
}

async function boot(){
  if(!window.claude || typeof window.claude.use !== "function"){ dbState="off"; return renderAll(); }
  let db=null;
  try{ db = await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ dbState="off"; return renderAll(); }
  DB = db; dbState = "ok";
  initGcal();
  initSample();
  try{
    DB.doc("meta/config").onSnapshot(s=>{
      const d = s.exists? s.data():null;
      if(d && Array.isArray(d.companies) && d.companies.length) CFG = buildCFG(d);
      renderAll();
    }, ()=>{});
    /* パスワード（会社ごとの共通パスワード） */
    DB.doc("meta/auth").onSnapshot(s=>{
      AUTH = s.exists? (s.data()||null) : null;
      loaded.auth = true;
      if(me){
        const fp = scopeFp(me.scope);
        if(!fp){ signOut(true); toast("ログイン設定が変更されました。もう一度ログインしてください"); return; }
        if(fp!==me.fp){ signOut(true); toast("パスワードが変更されました。新しいパスワードでログインしてください"); return; }
      }
      tryRestore(); renderAll();
    }, ()=>{ dbState="off"; renderAll(); });
    /* 名簿 */
    DB.collection("staff").onSnapshot(s=>{
      staff = s.docs.map(d=>({id:d.id, ...d.data()}));
      loaded.staff = true;
      if(me){
        const fresh = staffById(me.id);
        if(!fresh || fresh.active===false){ signOut(true); toast("名簿から外れたため、ログアウトしました"); return; }
        me.name = fresh.name;
      }
      tryRestore(); renderAll();
    }, ()=>{ dbState="off"; renderAll(); });
  }catch(e){ dbState="off"; renderAll(); }
}
function subscribeData(){
  unsubs.forEach(u=>{try{u();}catch(e){}}); unsubs=[];
  loaded.customers=loaded.events=loaded.todos=loaded.goals=loaded.mtgs=false;
  const sub=(name,setter)=>DB.collection(name).onSnapshot(s=>{
    setter(s.docs.map(d=>({id:d.id, ...d.data()}))); loaded[name]=true; refreshCurrent();
  }, ()=>{ loaded[name]=true; refreshCurrent(); });
  unsubs.push(sub("customers", v=>{ v.forEach(c=>{ if(STAGE_ALIAS[c.stage]) c.stage=STAGE_ALIAS[c.stage]; }); customers=v; }));
  unsubs.push(sub("events", v=>events=v));
  unsubs.push(sub("todos", v=>todos=v));
  unsubs.push(sub("goals", v=>goals=v));
  unsubs.push(sub("mtgs", v=>mtgs=v));
}

}

function refreshSessionFp(fp){
  if(!me) return;
  me.fp = fp;
  let has=false; try{ has=!!localStorage.getItem("crm.login"); }catch(e){}
  if(has) saveSession();
}
function tryRestore(){ if(!me && loaded.auth && loaded.staff) restoreSession(); }
function restoreSession(){
  let raw=null; try{ raw=localStorage.getItem("crm.login"); }catch(e){}
  if(!raw) return;
  let o=null; try{ o=JSON.parse(raw); }catch(e){ return clearSession(); }
  if(!o || !o.scope || !o.id) return clearSession();
  if(o.scope!==HQ && !companyById(o.scope)) return clearSession();
  const fp = scopeFp(o.scope);
  if(!fp || fp!==o.fp) return clearSession();      // パスワードが変わっていたら入り直し
  const s = staffById(o.id);
  if(!s || s.active===false) return clearSession(); // 名簿から外れていたら入り直し
  me = {scope:o.scope, id:s.id, name:s.name, fp:fp};
  afterLogin();
}

function gLocal(dt){
  if(/[+-]\d\d:\d\d$/.test(dt)) return {d:dt.slice(0,10), t:dt.slice(11,16)};
  const d=new Date(dt);
  if(isNaN(d)) return {d:String(dt).slice(0,10), t:String(dt).slice(11,16)};
  return {d:isoDate(d), t:pad(d.getHours())+":"+pad(d.getMinutes())};
}
function normalizeG(e){
  if(!e || e.status==="cancelled") return null;
  const st=e.start||{};
  if(st.dateTime){ const l=gLocal(st.dateTime); return {gid:e.id,date:l.d,time:l.t,title:e.summary||"（無題）",link:e.htmlLink||"",place:e.location||""}; }
  if(st.date) return {gid:e.id,date:String(st.date).slice(0,10),time:"",title:e.summary||"（無題）",link:e.htmlLink||"",place:e.location||""};
  return null;
}
function watchGcalMonth(ym){
  if(gcal.status!=="ready" || !gcal.mcp) return;
  if(gcal.range===ym && gcal.unwatch) return;
  if(gcal.unwatch){ try{gcal.unwatch();}catch(e){} gcal.unwatch=null; }
  gcal.range=ym; gcal.events=[]; gcal.evErr="";
  const [y,m]=ym.split("-").map(Number);
  const s=new Date(y,m-1,-7), e=new Date(y,m,7);
  const input={ startTime:isoDate(s)+"T00:00:00+09:00", endTime:isoDate(e)+"T23:59:59+09:00",
    orderBy:"startTime", pageSize:250, timeZone:"Asia/Tokyo" };
  try{
    gcal.unwatch = gcal.mcp.watchTool(GCAL,"list_events",input, ev=>{
      if(ev.type==="error"){
        const c=(ev.error&&ev.error.code)||"upstream_error";
        if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","selection_required"].includes(c)) gcal.events=[];
        if(c==="bad_request"||c==="capability_removed"){ gcal.evErr=""; gcalFetchOnce(input); return; }
        gcal.evErr=c; renderCalGrid(); return;
      }
      const p = ev.result && ev.result.payload;
      gcal.events = (p && Array.isArray(p.events) ? p.events : []).map(normalizeG).filter(Boolean);
      gcal.evErr=""; renderCalGrid();
    }, {cache:{staleTime:60000}, refetchInterval:300000});
  }catch(err){ gcal.evErr="upstream_error"; }
}
async function gcalFetchOnce(input){
  if(!gcal.mcp) return;
  try{
    const r = await gcal.mcp.callTool(GCAL,"list_events",input,{cache:{staleTime:60000}});
    const p = r && r.payload;
    gcal.events = (p && Array.isArray(p.events) ? p.events : []).map(normalizeG).filter(Boolean);
    gcal.evErr="";
  }catch(e){ gcal.evErr=(e&&e.code)||"upstream_error"; }
  renderCalGrid();
}
function addHour(t){
  const p=String(t||"10:00").split(":").map(Number);
  const d=new Date(2000,0,1,p[0]||0,p[1]||0); d.setHours(d.getHours()+1);
  return pad(d.getHours())+":"+pad(d.getMinutes());
}
/* 面談をGoogleカレンダーへ（顧客情報つき） */
function meetingGBody(c, m){
  const L = [];
  L.push("お客様：" + (c.name||"") + " 様（" + m.n + "面談）");
  L.push("会社：" + companyName(c.companyId));
  L.push("ランク：" + (c.rank || "未設定") + (c.rank? "（"+RANKS[c.rank].desc+"）":""));
  L.push("商談ステージ：" + (STAGE_NAME[c.stage] || "—"));
  const ps=(c.products||[]).map(p=>productName(c.companyId,p));
  if(ps.length) L.push("提案商品：" + ps.join("、"));
  if(c.tel) L.push("連絡先：" + c.tel);
  if(c.budgetTotal!=="" && c.budgetTotal!=null) L.push("総予算：" + man(c.budgetTotal) + " 万円");
  if(c.landStatus) L.push("土地：" + (LAND[c.landStatus]||"—") + (c.wishArea? "／希望エリア "+c.wishArea : ""));
  L.push("営業担当：" + staffName(c.ownerId));
  if(m.place) L.push("場所：" + m.place);
  const prev = lastDoneMeeting(c);
  if(prev && (prev.note||"").trim()) L.push("", "【前回（"+prev.n+"）の記録】", prev.note);
  if((m.note||"").trim()) L.push("", "【メモ】", m.note);
  L.push("", "— 住宅営業カルテ から登録された予定です");
  return L.join("\n");
}
async function gcalCreateMeeting(c, m){
  if(gcal.status!=="ready" || !gcal.mcp) return {ok:false, code:"server_not_connected"};
  const start = m.time || "10:00", end = addHour(start);
  const input = {
    summary: "【"+m.n+"面談】" + (c.name||"") + " 様（" + companyShort(c.companyId) + "）",
    startTime: m.date+"T"+start+":00+09:00",
    endTime: m.date+"T"+end+":00+09:00",
    timeZone: "Asia/Tokyo",
    description: meetingGBody(c,m),
    notificationLevel: "NONE",
  };
  if(m.place) input.location = m.place;
  try{
    const r = await gcal.mcp.callTool(GCAL,"create_event",input);
    const p = r && r.payload;
    if(p && p.id) return {ok:true, id:p.id, link:p.htmlLink||""};
    return {ok:false, code:"upstream_error"};
  }catch(e){ return {ok:false, code:(e&&e.code)||"upstream_error"}; }
}
async function gcalCreateEvent(doc){
  if(gcal.status!=="ready" || !gcal.mcp) return {ok:false, code:"server_not_connected"};
  const start = doc.startTime || "10:00";
  const end = (doc.endTime && doc.endTime>start) ? doc.endTime : addHour(start);
  const L = ["種別：" + (EVT[doc.type]||"その他"), "担当：" + staffName(doc.staffId)];
  if(doc.companyId) L.push("会社：" + companyName(doc.companyId));
  if(doc.place) L.push("場所：" + doc.place);
  if(doc.note) L.push("", doc.note);
  L.push("", "— 住宅営業カルテ から登録された予定です");
  const input = { summary:"【"+(EVT[doc.type]||"その他")+"】"+doc.title,
    startTime:doc.date+"T"+start+":00+09:00", endTime:doc.date+"T"+end+":00+09:00",
    timeZone:"Asia/Tokyo", description:L.join("\n"), notificationLevel:"NONE" };
  if(doc.place) input.location = doc.place;
  try{
    const r = await gcal.mcp.callTool(GCAL,"create_event",input);
    const p = r && r.payload;
    if(p && p.id) return {ok:true, id:p.id, link:p.htmlLink||""};
    return {ok:false, code:"upstream_error"};
  }catch(e){ return {ok:false, code:(e&&e.code)||"upstream_error"}; }
}
async function gcalRemove(gid){
  if(!gid || gcal.status!=="ready" || !gcal.mcp) return false;

/* パスワードが分からないときの作り直し。
   本部は「3社すべての共通パスワード」を知っている方だけが作り直せる。
   3社すべてを知っている＝すでに3社すべてを見られる、ということなので権限は増えない。 */
function openPwRecover(k){
  if(!k) return;
  const need = k===HQ ? companies().map(c=>c.id) : [HQ];
  const lead = k===HQ
    ? "本部のパスワードは、3社すべての共通パスワードが分かる方が作り直せます。3社すべてを知っている＝すでに3社すべてのお客様を見られる、という考え方です。"
    : "本部の共通パスワードが分かる方が、この会社のパスワードを作り直せます。";
  const body =
    '<div class="fset"><h4>先に試してみてください</h4><ul class="canlist">'+
      '<li>決めたときに<b>数字を全角</b>（０１２３）で入れていた場合は、<b>全角のまま</b>入れてみてください</li>'+
      '<li>大文字・小文字、全角・半角、前後の空白は区別しません（全角で決めたものを除く）</li>'+
      '<li>他の会社のパスワードと取り違えていないかご確認ください</li>'+
    '</ul></div>'+
    '<div class="fset"><h4>① '+esc(k===HQ? "3社すべてのパスワード":"本部のパスワード")+'</h4>'+
      '<p class="small muted" style="margin-bottom:12px">'+esc(lead)+'</p>'+
      need.map(n=>'<div style="margin-bottom:11px"><label class="lb">'+esc(scopeTitle(n))+'</label>'+pwField("rc_"+n)+'</div>').join("")+
    '</div>'+
    '<div class="fset"><h4>② '+esc(scopeTitle(k))+' の新しいパスワード</h4>'+
      '<div class="grid2">'+fld("新しいパスワード",pwField("rc_new","new-password"))+fld("確認のため再入力",pwField("rc_new2","new-password"))+'</div>'+
      '<button class="btn sm" id="rcGen" type="button" style="margin-top:11px">自動で作る</button>'+
      '<p class="tiny faint" style="margin-top:9px">作り直すと、'+esc(scopeTitle(k))+'でログインしている方は次から新しいパスワードになります。</p></div>'+
    '<div id="rcErr"></div>';
  openOverlay('<div class="drawer"><div class="dhead"><b>'+esc(scopeTitle(k))+' のパスワードを作り直す</b><div class="grow"></div>'+
    '<button class="x" id="dClose">'+I.x+'</button></div><div class="dbody">'+body+'</div>'+
    '<div class="dfoot"><button class="btn primary" id="rcGo">作り直す</button>'+
    '<button class="btn" id="dCancel">やめる</button></div></div>');
  $("#dClose").addEventListener("click",closeOverlay);
  $("#dCancel").addEventListener("click",closeOverlay);
  $("#rcGen").addEventListener("click",()=>{ setPwInputs(["rc_new","rc_new2"], easyPw()); });
  $("#rcGo").addEventListener("click", async ()=>{
    const err=$("#rcErr"), btn=$("#rcGo");
    const p1=normPw($("#rc_new").value), p2=normPw($("#rc_new2").value);
    if(p1.length<4) return void(err.innerHTML='<div class="err">新しいパスワードを4文字以上で入れてください。</div>');
    if(p1!==p2) return void(err.innerHTML='<div class="err">確認用のパスワードが一致しません。</div>');
    btn.disabled=true; btn.textContent="確認中…";
    for(const n of need){
      if(!await pwMatches(scopeAuth(n), $("#rc_"+n).value)){
        btn.disabled=false; btn.textContent="作り直す";
        return void(err.innerHTML='<div class="err">'+esc(scopeTitle(n))+' のパスワードが違います。</div>');
      }
    }
    try{
      await writeScopePw(k, p1, "ログイン画面から再設定");
      showPwList([[scopeTitle(k), p1]], "パスワードを作り直しました",
        "この内容でログインできます。"+(k===HQ? "本部で使う方":scopeTitle(k)+"の全員")+"に伝えてください。");
    }catch(e){ btn.disabled=false; btn.textContent="作り直す"; err.innerHTML='<div class="err">作り直せませんでした。</div>'; }
  });
}
function bindLogin(){
  bindEyes();
  document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    login.scope=b.dataset.pick; login.err=""; login.staffId=lastNameFor(login.scope); renderAll();
  }));
  const back=$("#lgBack");
  if(back) back.addEventListener("click",()=>{ login.scope=""; login.err=""; renderAll(); });
  const hlp=$("#lgHelp");
  if(hlp) hlp.addEventListener("click",()=>openPwRecover(login.scope));
  const ns=$("#lg_name");
  if(ns) ns.addEventListener("change",()=>{
    const w=$("#lg_newwrap"); if(w) w.hidden = ns.value!=="__new";
    if(ns.value==="__new"){ const el=$("#lg_newname"); if(el) el.focus(); }
  });
  const form=$("#loginForm");
  form.addEventListener("submit", async ev=>{
    ev.preventDefault();
    const k=login.scope; if(!k) return;
    const a=scopeAuth(k);
    const pw=($("#lg_pw")||{}).value||"";
    const fail=m=>{ login.err=m; login.staffId=($("#lg_name")||{}).value||""; login.newName=(($("#lg_newname")||{}).value||"").trim(); renderAll(); };
    if(!a || !a.hash) return fail("この会社のパスワードがまだ設定されていません。本部の方に設定を依頼してください。");
    if(!await pwMatches(a, pw))
      return fail("パスワードが違います。決めたときに全角（０１２３）で入れていた場合は、全角のまま入れてみてください。分からないときは下の「パスワードが分からない・入れないとき」から作り直せます。");
    /* 名前 */
    const v=($("#lg_name")||{}).value||"__new";
    let sid=v, nm="";
    if(v==="__new"){
      nm=(($("#lg_newname")||{}).value||"").trim();
      if(!nm) return fail("お名前を入れてください。");
      const dup = roster().find(s=>s.name===nm && (k===HQ || (s.companies||[]).includes(k)));
      if(dup) sid=dup.id;
      else{
        sid=uid();
        const comps = k===HQ ? companies().map(c=>c.id) : [k];
        try{ await DB.doc("staff/"+sid).set({name:nm, companies:comps, active:true, tel:"", email:"", createdAt:new Date().toISOString()}); }
        catch(e){ return fail("名簿に登録できませんでした。時間をおいて再度お試しください。"); }
      }
    }else{
      const s=staffById(sid);
      if(!s) return fail("お名前を選び直してください。");
      nm=s.name;
    }
    const rem = !!(($("#lg_remember")||{}).checked);
    login.remember=rem; login.err=""; login.newName="";
    me = {scope:k, id:sid, name:nm, fp:scopeFp(k)};
    setLastNameFor(k, sid);
    if(rem) saveSession(); else clearSession();
    afterLogin(); renderAll();
  });
}

function filteredCustomers(){
  let list = scopedActive();
  const tab = ui.rankTab;
  if(tab==="A"||tab==="B"||tab==="C") list = list.filter(c=>c.rank===tab);
  else if(tab==="none") list = list.filter(c=>!c.rank);
  if(ui.fStage) list = list.filter(c=>c.stage===ui.fStage);
  if(ui.fProduct) list = list.filter(c=>(c.products||[]).includes(ui.fProduct));
  if(ui.fStatus) list = list.filter(c=>statusOf(c).key===ui.fStatus);
  if(ui.fApply) list = list.filter(c=>ui.fApply==="yes"? !!c.applied : !c.applied);
  if(ui.fAlert) list = list.filter(needsFollow);
  const q = ui.fQuery.trim().toLowerCase();
  if(q) list = list.filter(c=>[c.name,c.kana,c.tel,c.email,c.address,c.memo,c.wishArea,c.showroom]
    .some(v=>String(v||"").toLowerCase().includes(q))
    || (c.meetings||[]).some(m=>String(m.note||"").toLowerCase().includes(q)));
  const {key,dir} = ui.sort, ro={A:0,B:1,C:2,"":3};
  return list.slice().sort((a,b)=>{
    let x,y;
    if(key==="rank"){ x=ro[a.rank||""]; y=ro[b.rank||""]; }
    else if(key==="name") return String(a.name||"").localeCompare(String(b.name||""),"ja")*dir;
    else if(key==="owner") return String(staffName(a.ownerId)).localeCompare(String(staffName(b.ownerId)),"ja")*dir;
    else if(key==="inquiry"){ x=a.inquiryDate||"9999"; y=b.inquiryDate||"9999"; return String(x).localeCompare(String(y))*dir; }
    else { x=nextDate(a)||"9999-99-99"; y=nextDate(b)||"9999-99-99"; return String(x).localeCompare(String(y))*dir; }
    return (x-y)*dir;
  });
}

function renderMeetings(root){
  const up = upcomingList();
  let h = topbar("面談予定", '<button class="btn" data-go="calendar">カレンダーで見る</button>');
  h += '<div class="content">';
  if(!up.length){
    h += '<div class="panel"><div class="empty">予定されている面談はありません。<br>顧客カルテの「面談記録」に次回の日付を入れると、ここに時系列で並びます。</div></div>';
  }else{
    const g={over:[],today:[],week:[],later:[]};
    up.forEach(x=>{ const d=daysFrom(x.m.date); if(d<0)g.over.push(x); else if(d===0)g.today.push(x); else if(d<=7)g.week.push(x); else g.later.push(x); });
    [["today","本日の面談","var(--accent)"],["over","記録漏れ・期限超過","var(--danger)"],
     ["week","今後7日以内","var(--rank-b)"],["later","それ以降","var(--muted)"]].forEach(([k,title,col])=>{
      if(!g[k].length) return;
      h += '<div class="sechead"><h2 style="color:'+col+'">'+esc(title)+'</h2><span class="hint">'+g[k].length+'件</span></div>'+
        '<div class="panel">'+g[k].map(({c,m})=>schedRowHTML(c,m)).join("")+'</div>';
    });
    if(g.over.length) h += '<div class="banner warn" style="margin-top:14px">'+
      '「記録漏れ・期限超過」は、日付が過ぎているのに面談メモが空のままのものです。カルテを開いて内容を記録すると実施済みになります。</div>';
  }
  const noNext = scopedActive().filter(c=>!scheduledMeeting(c) && !c.contracted && !c.lost);
  if(noNext.length){
    h += '<div class="sechead"><h2>次回アポ未設定</h2><span class="hint">'+noNext.length+'件</span></div><div class="panel">'+
      sortBy(noNext, c=>lastContact(c)||"", "asc").map(c=>{
        const lc = lastContact(c), d = lc? -daysFrom(lc) : null;
        return '<div class="li click" data-cust="'+c.id+'"><span class="rank '+(c.rank||"X")+'">'+(c.rank||"–")+'</span>'+
          '<span class="grow" style="min-width:0"><div class="cname">'+esc(c.name||"（無名）")+'</div>'+
          '<div class="tiny faint">'+esc(staffName(c.ownerId))+' ・ '+esc(companyShort(c.companyId))+
          (lc? ' ・ 最終接触 '+esc(fmtDY(lc)) : ' ・ 接触記録なし')+'</div></span>'+
          (d!==null&&isFinite(d)? '<span class="tiny nowrap" style="color:'+(d>=FOLLOW_DAYS?"var(--danger)":"var(--muted)")+'">'+d+'日経過</span>':'')+
          '</div>';
      }).join("")+'</div>';
  }
  h += '</div>';
  root.innerHTML = h;
  bindCommon(root);
}

function collectCustomer(){
  document.querySelectorAll(".drawer [data-f]").forEach(el=>{ drawerCust[el.dataset.f]=el.value; });
  const blocks = document.querySelectorAll(".drawer .mblock");
  if(blocks.length){
    const out=[];
    blocks.forEach(b=>{
      const idx = Number(b.dataset.mi);
      const old = (drawerCust.meetings||[])[idx] || {};
      const g = k => { const el=b.querySelector('[data-m="'+k+'"]'); return el? el.value.trim() : ""; };
      const m = {date:g("date"), time:g("time"), place:g("place"), note:g("note")};
      if(old.gcalId){ m.gcalId=old.gcalId; m.gcalLink=old.gcalLink||""; }
      if(m.date||m.time||m.place||m.note||old.gcalId) out.push(m);
    });
    drawerCust.meetings = out;
  }
}

async function pushMeetingsToGoogle(){
  collectCustomer();
  const c = drawerCust;
  if(!c.name || !c.name.trim()) return toast("先に氏名を入力して保存してください");
  const ms = meetingsOf(c).filter(m=>m.date && !meetingDone(m) && !m.gcalId);
  const box = $("#mPushMsg");
  if(!ms.length) return void(box.innerHTML='<div class="banner">Googleカレンダーに未登録の「予定」の面談はありません。</div>');
  const btn = $("#mPushG"); btn.disabled=true; btn.textContent="登録中…";
  let ok=0, errCode="";
  for(const m of ms){
    const r = await gcalCreateMeeting(c, m);
    if(r.ok){ drawerCust.meetings[m.idx].gcalId=r.id; drawerCust.meetings[m.idx].gcalLink=r.link; ok++; }
    else errCode = r.code;
  }
  await saveCustomer(true);
  await gcalRefresh();
  btn.disabled=false; btn.textContent="未登録の予定をGoogleカレンダーに登録";
  if(ok) toast(ok+"件をGoogleカレンダーに登録しました");
  if(errCode){ const g=gcalMsg(errCode); box.innerHTML='<div class="banner '+g.cls+'">'+g.text+'</div>'; }
  paintCustomer();
}
async function saveCustomer(silent){
  collectCustomer();
  const c = drawerCust;
  if(!c.name || !c.name.trim()){ toast("氏名を入力してください"); return false; }
  if(!c.companyId){ toast("会社を選択してください"); return false; }
  const doc = JSON.parse(JSON.stringify(c));
  delete doc.id;
  ["familySize","kids","income","savings","loanWish","budgetTotal","tsubo","landArea","contractAmount","grossProfit","expectedAmount","age","landPrice","buildingPrice"]
    .forEach(k=>{ doc[k] = (doc[k]===""||doc[k]==null) ? "" : num(doc[k]); });
  doc.products = c.products||[];
  doc.meetings = (c.meetings||[]).map(m=>({date:m.date||"",time:m.time||"",place:m.place||"",note:m.note||"",
    ...(m.gcalId?{gcalId:m.gcalId,gcalLink:m.gcalLink||""}:{})}));
  doc.lost = !!c.lost; doc.contracted = !!c.contracted;
  doc.applied = !!doc.appliedDate || c.applied===true;
  if(!doc.applied) doc.appliedDate = "";
  if(doc.goalDate) doc.expectedMonth = String(doc.goalDate).slice(0,7);   /* 着地予想は目標日の月で数える */
  /* 工程が変わったら記録する（営業会議の「工程が進んだ」に使う） */
  const orig = c.id ? customers.find(x=>x.id===c.id) : null;
  doc.stageLog = Array.isArray(doc.stageLog) ? doc.stageLog : [];
  if(!orig || orig.stage!==doc.stage) doc.stageLog = doc.stageLog.concat([{stage:doc.stage||"", date:TODAY(), by:me.name||""}]);
  doc.updatedAt = new Date().toISOString();
  try{
    if(c.id) await DB.doc("customers/"+c.id).set(doc);
    else{ doc.createdAt=new Date().toISOString(); const ref=await DB.collection("customers").add(doc); drawerCust.id=ref.id; }
    if(!silent){ toast("保存しました"); closeOverlay(); }
    return true;
  }catch(e){ toast("保存できませんでした（"+((e&&e.code)||"error")+"）"); return false; }
}
async function markContract(on){
  collectCustomer();
  if(on){
    if(!drawerCust.contractDate) drawerCust.contractDate = TODAY();
    if(!drawerCust.contractAmount && drawerCust.contractAmount!==0){
      const ok = await askConfirm("契約済にする","契約金額が未入力です。このまま契約済にしますか？\n（あとで「資金・土地」タブから入力できます）","このまま契約済にする");
      if(!ok){ drawerTab="money"; return paintCustomer(); }
    }
    drawerCust.contracted=true; drawerCust.lost=false;
  } else drawerCust.contracted=false;
  if(await saveCustomer(true)){ toast(on? "契約済リストに移動しました":"商談に戻しました"); closeOverlay(); }
}
async function markLost(on){
  collectCustomer();
  if(on){
    const r = await askPrompt("没にする","このお客様を没リストに移動します。理由があれば入力してください（空欄でも構いません）。","例：他社で契約／検討中止","没にする");
    if(r===null) return;
    drawerCust.lost=true; drawerCust.lostReason=(r||"").trim(); drawerCust.lostDate=TODAY(); drawerCust.contracted=false;
  }else{ drawerCust.lost=false; drawerCust.lostReason=""; drawerCust.lostDate=""; }
  if(await saveCustomer(true)){ toast(on? "没リストに移動しました":"商談に戻しました"); closeOverlay(); }
}
async function deleteCustomer(){
  const c = drawerCust; if(!c.id) return;
  const ok = await askConfirm("顧客を削除","「"+c.name+"」を完全に削除します。面談記録も含めて元に戻せません。\n（見送りの場合は「没にする」をおすすめします）","削除する",true);
  if(!ok) return;
  for(const m of (c.meetings||[])) if(m.gcalId) await gcalRemove(m.gcalId);
  try{
    await DB.doc("customers/"+c.id).delete();
    for(const e of events.filter(x=>x.customerId===c.id)) await DB.doc("events/"+e.id).update({customerId:""});

  }catch(e){ toast("削除できませんでした"); }
}

        '<span class="tiny row" style="gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:var(--rank-b);display:inline-block"></span>面談B</span>'+
        '<span class="tiny row" style="gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:var(--rank-c);display:inline-block"></span>面談C</span>'+

  root.innerHTML = h;
  $("#calPrev").addEventListener("click",()=>{ ui.calYM=shiftYM(ui.calYM,-1); renderCalendar(root); });
  $("#calNext").addEventListener("click",()=>{ ui.calYM=shiftYM(ui.calYM,1); renderCalendar(root); });
  $("#calToday").addEventListener("click",()=>{ const n=new Date(); ui.calYM=n.getFullYear()+"-"+pad(n.getMonth()+1); renderCalendar(root); });
  $("#calNew").addEventListener("click",()=>openEvent(null));

  const gs=$("#gcalShow"); if(gs) gs.addEventListener("change",()=>{ setGcalPref("show",gs.checked); renderCalGrid(); });
  watchGcalMonth(ui.calYM);
  renderCalGrid();

function renderCalGrid(){
  const box=$("#calBox"); if(!box) return;
  const [y,m]=ui.calYM.split("-").map(Number);
  const first=new Date(y,m-1,1), start=new Date(y,m-1,1-first.getDay()), t=TODAY();
  const byDate={};
  const put=(d,o)=>{ (byDate[d]=byDate[d]||[]).push(o); };
  scoped().forEach(c=>{
    if(c.lost) return;
    meetingsOf(c).forEach(mm=>{
      if(!mm.date) return;
      put(mm.date,{kind:"m", custId:c.id, rank:c.rank||"X", done:meetingDone(mm),
        title:(c.name||"（無名）")+" "+mm.n, time:mm.time||"", _t:mm.time||"50"});
    });
  });
  visEvents().forEach(e=>{ if(e.date) put(e.date,{kind:"e", id:e.id, title:e.title, time:e.startTime||"", _t:e.startTime||"60"}); });
  if(gcal.status==="ready" && gcalShow()){
    const mine = new Set();
    events.forEach(e=>{ if(e.gcalId) mine.add(e.gcalId); });
    customers.forEach(c=>(c.meetings||[]).forEach(mm=>{ if(mm.gcalId) mine.add(mm.gcalId); }));
    gcal.events.filter(g=>!mine.has(g.gid)).forEach(g=>put(g.date,{kind:"g", gid:g.gid, title:g.title, link:g.link, place:g.place, time:g.time, _t:g.time||"70"}));
  }
  Object.values(byDate).forEach(a=>a.sort((x,z)=>String(x._t).localeCompare(String(z._t))));
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const ds=isoDate(d), out=d.getMonth()!==m-1, dow=d.getDay(), list=byDate[ds]||[];
    cells += '<div class="cell'+(out?" out":"")+(ds===t?" today":"")+'" data-day="'+ds+'">'+
      '<span class="dn'+(dow===0?" sun":dow===6?" sat":"")+'">'+d.getDate()+'</span>'+
      list.slice(0,4).map(o=>{
        if(o.kind==="g") return '<div class="ev gcal" data-glink="'+esc(o.link)+'" data-gtitle="'+esc(o.title)+'" title="Googleカレンダー：'+esc(o.title)+'">'+
          (o.time?'<span class="mono">'+esc(o.time)+'</span> ':'')+esc(o.title)+'</div>';
        if(o.kind==="e") return '<div class="ev other" data-ev="'+o.id+'" title="'+esc(o.title)+'">'+
          (o.time?'<span class="mono">'+esc(o.time)+'</span> ':'')+esc(o.title)+'</div>';
        return '<div class="ev m'+o.rank+(o.done?" done":"")+'" data-cust="'+o.custId+'" title="'+esc(o.title)+(o.done?"（実施済）":"（予定）")+'">'+
          (o.time?'<span class="mono">'+esc(o.time)+'</span> ':'')+esc(o.title)+'</div>';
      }).join("")+
      (list.length>4? '<span class="tiny faint">ほか'+(list.length-4)+'件</span>':'')+'</div>';
  }
  box.innerHTML = '<div class="cal"><div class="calhead">'+
    WD.map((w,i)=>'<div class="'+(i===0?"sun":i===6?"sat":"")+'">'+w+'</div>').join("")+'</div>'+
    '<div class="calgrid">'+cells+'</div></div>'+
    (gcal.evErr? (()=>{const g=gcalMsg(gcal.evErr); return '<div class="banner '+g.cls+'" style="margin-top:10px">'+g.text+'</div>';})():'')+
    '<p class="tiny faint" style="margin-top:8px">面談はお客様のカルテから登録します。日付をクリックすると面談以外の予定を追加できます。'+
    (gcal.status==="ready"&&gcalShow()? '　破線はGoogleカレンダーから読み込んだ予定です（このアプリでは編集できません）。':'')+'</p>';
  box.querySelectorAll(".cell").forEach(c=>c.addEventListener("click",e=>{
    if(e.target.closest(".ev")) return; openEvent(null,{date:c.dataset.day});
  }));
  box.querySelectorAll("[data-cust]").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); openCustomer(el.dataset.cust); }));
  box.querySelectorAll("[data-ev]").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); openEvent(el.dataset.ev); }));
  box.querySelectorAll("[data-glink]").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); openGEvent(el); }));
}

/* ---------- 年度 ---------- */
const fyStart = () => { const m = num(CFG.fyStart); return m>=1 && m<=12 ? m : 4; };
function fyOf(dateStr){
  const d = parseD(String(dateStr||"").slice(0,10)); if(!d) return null;
  return (d.getMonth()+1) >= fyStart() ? d.getFullYear() : d.getFullYear()-1;
}
function fyMonths(fy){ const out=[]; for(let i=0;i<12;i++){ const d=new Date(fy, fyStart()-1+i, 1); out.push(d.getFullYear()+"-"+pad(d.getMonth()+1)); } return out; }
function fyLabel(fy){ const m=fyMonths(fy); return fy+"年度（"+m[0].replace("-","/")+"〜"+m[11].replace("-","/")+"）"; }
const inqDate = c => c.inquiryDate || String(c.createdAt||"").slice(0,10);

function renderReport(root){
  const curFY = fyOf(TODAY());
  if(!ui.fy) ui.fy = String(curFY);
  const allFY = ui.fy==="all", fy = allFY ? null : Number(ui.fy);
  const base = scoped();
  const inFY = d => allFY ? !!d : fyOf(d)===fy;
  /* その年度に起きたこと：反響（問合せ日）・申込（申込日）・契約（契約日）・没（没日） */
  const fresh = base.filter(c=> allFY ? true : inFY(inqDate(c)));
  const aps   = base.filter(c=>c.applied && (allFY || inFY(c.appliedDate)));
  const won   = base.filter(c=>c.contracted && (allFY || inFY(c.contractDate)));
  const lost  = base.filter(c=>c.lost && (allFY || inFY(c.lostDate)));
  const act   = scopedActive();
  const amt = won.reduce((s,c)=>s+num(c.contractAmount),0);
  const gp  = won.reduce((s,c)=>s+num(c.grossProfit),0);
  const rate = (won.length+lost.length)? Math.round(won.length/(won.length+lost.length)*100) : 0;
  const apRate = aps.length? Math.round(won.filter(c=>c.applied).length/aps.length*100) : 0;
  const years = new Set([curFY]);
  base.forEach(c=>[inqDate(c), c.appliedDate, c.contractDate, c.lostDate].forEach(d=>{ const y=fyOf(d); if(y) years.add(y); }));
  const groupers = {
    owner:{name:"担当者別", key:c=>c.ownerId, label:staffName},
    company:{name:"会社別", key:c=>c.companyId, label:companyName},
    product:{name:"商品別", key:null},
    rank:{name:"ランク別", key:c=>c.rank||"", label:k=>k? k+"："+RANKS[k].desc : "未設定"},
    source:{name:"反響経路別", key:c=>c.source||"", label:k=>k||"未設定"},
    showroom:{name:"展示場・反響元別", key:c=>c.showroom||"", label:k=>k||"未設定"},
    stage:{name:"ステージ別", key:c=>c.stage||"", label:k=>STAGE_NAME[k]||"未設定"},
  };
  let h = topbar("集計・分析",
    '<select id="fySel" style="width:auto">'+[...years].sort((a,b)=>b-a).map(y=>'<option value="'+y+'"'+(ui.fy===String(y)?" selected":"")+'>'+esc(fyLabel(y))+'</option>').join("")+
      '<option value="all"'+(allFY?" selected":"")+'>全期間</option></select>'+
    '<select id="fyStartSel" style="width:auto" title="年度の始まりの月">'+[...Array(12)].map((_,i)=>'<option value="'+(i+1)+'"'+(fyStart()===i+1?" selected":"")+'>'+(i+1)+'月始まり</option>').join("")+'</select>'+
    '<button class="btn sm" id="csvBtn2">CSV書き出し</button>');
  h += '<div class="content">'+
    '<p class="small muted" style="margin-bottom:12px">'+(allFY? '全期間の集計です。' : esc(fyLabel(fy))+' に起きたことを数えています（反響＝問合せ日、申込＝申込日、契約＝契約日、没＝没日）。')+'</p>'+
    '<div class="kpis">'+
    kpi("", "反響（新規）", fresh.length, "件", allFY? "登録顧客すべて" : "問合せ日がこの年度")+
    kpi("", "申込", aps.length, "件", "うち契約済 "+won.filter(c=>c.applied).length+"件（"+apRate+"%）")+
    kpi("ok", "契約", won.length, "棟", man(amt)+" 万円")+
    kpi("", "平均契約単価", won.length? Math.round(amt/won.length):0, "万円", "粗利計 "+man(gp)+" 万円")+
    kpi("", "成約率", rate, "%", "契約 "+won.length+" / 没 "+lost.length)+
    kpi("warn", "要フォロー", act.filter(needsFollow).length, "件", "いま・次回アポ未設定")+
    '</div>';
  h += '<div class="tabs" style="margin-top:18px">'+Object.entries(groupers).map(([k,g])=>
    '<button data-rb="'+k+'" class="'+(ui.reportBy===k?"on":"")+'">'+esc(g.name)+'</button>').join("")+'</div>';
  /* 区分ごとに 反響・申込・契約・受注額 */
  const t = {};
  const bump = (keys, f) => keys.forEach(([k,label])=>{ t[k]=t[k]||{label, n:0, ap:0, won:0, amt:0}; f(t[k]); });
  const keysOf = c => {
    if(ui.reportBy==="product") return (c.products||[]).map(p=>[c.companyId+"|"+p, productName(c.companyId,p)+(scopeCompanies().length>1?"（"+companyShort(c.companyId)+"）":"")]);
    const g = groupers[ui.reportBy], k = g.key(c)||""; return [[k, g.label(k)||"未設定"]];
  };
  fresh.forEach(c=>bump(keysOf(c), r=>r.n++));
  aps.forEach(c=>bump(keysOf(c), r=>r.ap++));
  won.forEach(c=>bump(keysOf(c), r=>{ r.won++; r.amt+=num(c.contractAmount); }));
  const rows = Object.values(t).sort((a,b)=>(b.won-a.won)||(b.ap-a.ap)||(b.n-a.n));
  const R = 'style="text-align:right"';
  h += '<div class="panels" style="grid-template-columns:repeat(auto-fit,minmax(400px,1fr));margin-top:14px">';
  h += '<div class="panel"><header><h3>'+esc(groupers[ui.reportBy].name)+' 契約棟数</h3><div class="grow"></div><span class="tiny muted">申込・反響は右の内訳</span></header><div class="bars">'+
    (rows.length? barRows(rows.map(r=>[r.label, r.won, "var(--ok)"])) : '<div class="lane-empty">データがありません</div>')+'</div></div>';
  h += '<div class="panel"><header><h3>'+esc(groupers[ui.reportBy].name)+' 内訳</h3></header>'+
    '<div class="tablewrap" style="border:0"><table><thead><tr><th>区分</th><th '+R+'>反響</th><th '+R+'>申込</th>'+
    '<th '+R+'>契約</th><th '+R+'>受注額（万円）</th></tr></thead><tbody>'+
    (rows.length? rows.map(r=>'<tr><td>'+esc(r.label)+'</td><td class="num" '+R+'>'+r.n+'</td><td class="num" '+R+'>'+r.ap+'</td>'+
      '<td class="num" '+R+'>'+r.won+'</td><td class="num" '+R+'>'+man(r.amt)+'</td></tr>').join("")+
      '<tr style="border-top:2px solid var(--border-strong)"><td><b>合計</b></td><td class="num" '+R+'>'+fresh.length+'</td><td class="num" '+R+'>'+aps.length+'</td>'+
      '<td class="num" '+R+'>'+won.length+'</td><td class="num" '+R+'>'+man(amt)+'</td></tr>'
      : '<tr><td colspan="5" class="empty">データがありません</td></tr>')+'</tbody></table></div></div>';
  /* 月別：年度の12か月（全期間なら直近12か月） */
  let months;
  if(allFY){ months=[]; const now=new Date(); for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(d.getFullYear()+"-"+pad(d.getMonth()+1)); } }
  else months = fyMonths(fy);
  const mrows = months.map(ym=>({ym,
    ap: base.filter(c=>c.applied && String(c.appliedDate||"").startsWith(ym)).length,
    n: base.filter(c=>c.contracted && String(c.contractDate||"").startsWith(ym)).length,
    amt: base.filter(c=>c.contracted && String(c.contractDate||"").startsWith(ym)).reduce((s,c)=>s+num(c.contractAmount),0)}));
  const mmax = Math.max(1,...mrows.map(r=>Math.max(r.n, r.ap)));
  h += '<div class="panel" style="grid-column:1/-1"><header><h3>月別 申込・契約（'+esc(allFY? "直近12か月" : fyLabel(fy))+'）</h3><div class="grow"></div>'+
    '<span class="tiny muted row" style="gap:10px"><span class="row" style="gap:4px"><i style="width:10px;height:10px;border-radius:2px;background:color-mix(in srgb,var(--ok) 35%,var(--surface3));display:inline-block"></i>申込</span>'+
    '<span class="row" style="gap:4px"><i style="width:10px;height:10px;border-radius:2px;background:var(--ok);display:inline-block"></i>契約</span></span>'+
    '<span class="chip">申込 '+mrows.reduce((s,r)=>s+r.ap,0)+' 件 ／ 契約 '+mrows.reduce((s,r)=>s+r.n,0)+' 棟・'+man(mrows.reduce((s,r)=>s+r.amt,0))+' 万円</span></header>'+
    '<div style="display:flex;align-items:flex-end;gap:6px;padding:18px 16px;height:200px">'+
    mrows.map(r=>'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end">'+
      '<span class="mono tiny" style="color:var(--muted)">'+(r.ap||r.n? r.ap+"/"+r.n : "")+'</span>'+
      '<div style="width:100%;display:flex;gap:2px;align-items:flex-end;height:100%">'+
        '<div style="flex:1;background:'+(r.ap?"color-mix(in srgb,var(--ok) 35%,var(--surface3))":"var(--surface3)")+';border-radius:3px 3px 0 0;height:'+Math.max(3,r.ap/mmax*100)+'%" title="申込 '+r.ap+'件"></div>'+
        '<div style="flex:1;background:'+(r.n?"var(--ok)":"var(--surface3)")+';border-radius:3px 3px 0 0;height:'+Math.max(3,r.n/mmax*100)+'%" title="契約 '+r.n+'棟"></div></div>'+
      '<span class="mono tiny faint">'+r.ym.slice(5)+'月</span></div>').join("")+'</div></div>';
  h += '</div></div>';
  root.innerHTML=h;
  root.querySelectorAll("[data-rb]").forEach(b=>b.addEventListener("click",()=>{ ui.reportBy=b.dataset.rb; renderReport(root); }));
  $("#fySel").addEventListener("change",e=>{ ui.fy=e.target.value; renderReport(root); });
  $("#fyStartSel").addEventListener("change", async e=>{
    const m = Number(e.target.value);
    CFG = {...CFG, fyStart:m}; ui.fy = String(fyOf(TODAY())); renderReport(root);
    try{ await saveConfig(); toast("年度の始まりを"+m+"月にしました（全員に反映）"); }catch(err){ toast("保存できませんでした"); }
  });
  $("#csvBtn2").addEventListener("click", exportCSV);
}
async function exportCSV(){
  const list = view==="customers" ? filteredCustomers() : scoped();
  const head=["ランク","顧客名","ふりがな","会社","担当者","状況","ステージ","問合せ日","反響経路","展示場",
    "電話","メール","住所","土地状況","希望エリア","世帯年収(万)","自己資金(万)","借入希望(万)","総予算(万)","ローン審査",
    "提案商品","本命商品","建築希望時期","確度","契約目標日","見込み金額(万)","年齢","建設予定地","種別","申込","設計担当","問題点","面談回数","次回アポ","最終接触","直近の面談メモ","契約日","契約金額(万)","粗利(万)","没日","没理由","メモ"];
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""').replace(/\r?\n/g," ")+'"';

      c.mainProductId? productName(c.companyId,c.mainProductId):"", c.buildTiming,
      c.forecast&&FORECAST[c.forecast]? FORECAST[c.forecast].mark : "", c.goalDate||c.expectedMonth||"", c.expectedAmount,
      c.age, c.buildSite, c.buildType, c.applied?"有"+(c.appliedDate? " "+c.appliedDate:""):"無", c.designer, c.issues,
      (c.meetings||[]).length, nextDate(c)||"", lastContact(c)||"", ld?ld.note:"",
      c.contractDate, c.contractAmount, c.grossProfit, c.lostDate, c.lostReason, c.memo].map(q).join(",");

  const csv = "﻿"+lines.join("\r\n");

  try{ await dl.save({filename:"顧客リスト_"+TODAY()+".csv", data:csv}); toast("CSVを書き出しました"); }
  catch(e){ if(e&&e.code==="declined") return; toast("書き出しできませんでした"); }
}

async function writeScopePw(k, pw, byName){
  const salt=newSalt(), hash=await hashPw(salt,pw);
  const scopes = Object.assign({}, (AUTH&&AUTH.scopes)||{});
  scopes[k] = {salt, hash, updatedAt:new Date().toISOString(), updatedBy:byName||(me&&me.name)||"再設定"};
  const prev = me? me.fp : "";
  const mine = !!(me && k===me.scope);
  if(mine) refreshSessionFp(String(hash).slice(0,16));   /* 変更した本人はログインを保つ */
  try{ await DB.doc("meta/auth").set({scopes, updatedAt:new Date().toISOString()}); }
  catch(e){ if(mine) refreshSessionFp(prev); throw e; }
  return hash;
}

    '<div id="lvErr"></div>';
  openOverlay('<div class="drawer"><div class="dhead"><b>退職者の処理</b><div class="grow"></div>'+
    '<button class="x" id="dClose">'+I.x+'</button></div><div class="dbody">'+body+'</div>'+
    '<div class="dfoot"><button class="btn primary" id="lvGo">この内容で実行する</button>'+
    '<button class="btn" id="dCancel">やめる</button></div></div>');
  $("#dClose").addEventListener("click",closeOverlay);
  $("#dCancel").addEventListener("click",closeOverlay);
  $("#lvGen").addEventListener("click",()=>{ setPwInputs(["lvPw","lvPw2"], easyPw()); });
  const who=$("#lvWho"), to=$("#lvTo");
  const sync=()=>{
    const s=staffById(who.value);
    const n=customers.filter(c=>c.ownerId===who.value && canSeeCompany(c.companyId)).length;
    $("#lvCount").innerHTML = n? '担当しているお客様は <b class="num">'+n+'</b> 件です。'
      : 'このメンバーが担当しているお客様はありません。';
    document.querySelectorAll("[data-lvk]").forEach(b=>{
      const k=b.dataset.lvk;
      b.checked = s? (k===HQ ? false : (s.companies||[]).includes(k)) : false;
    });
    [...to.options].forEach(o=>{ o.hidden = o.value===who.value; });
    if(to.value===who.value) to.value="";
  };
  who.addEventListener("change",sync); sync();
  $("#lvGo").addEventListener("click", async ()=>{
    const err=$("#lvErr"), btn=$("#lvGo");
    const s=staffById(who.value); if(!s) return;
    const rot=[...document.querySelectorAll("[data-lvk]")].filter(b=>b.checked).map(b=>b.dataset.lvk);
    const p1=normPw($("#lvPw").value), p2=normPw($("#lvPw2").value);

      if(p1.length<4) return void(err.innerHTML='<div class="err">新しいパスワードを4文字以上で入れてください。</div>');

    btn.disabled=true; btn.textContent="処理中…";
    const target=$("#lvTo").value;
    try{
      for(const c of customers.filter(c=>c.ownerId===s.id && canSeeCompany(c.companyId)))
        await DB.doc("customers/"+c.id).update({ownerId:target, updatedAt:new Date().toISOString()});
      for(const t of todos.filter(t=>t.staffId===s.id))
        await DB.doc("todos/"+t.id).update({staffId: target||me.id});
      const rest=(s.companies||[]).filter(c=>!canSeeCompany(c));
      if(rest.length) await DB.doc("staff/"+s.id).update({companies:rest});
      else await DB.doc("staff/"+s.id).delete();
      const rows=[];
      for(const k of rot){ await writeScopePw(k, p1, me.name); rows.push([scopeTitle(k), p1]); }
      if(rows.length) showPwList(rows, "退職者の処理が終わりました",
        "「"+s.name+"」さんを名簿から外しました。新しいパスワードを、残るメンバー全員に伝えてください。");
      else{ toast("「"+s.name+"」さんを名簿から外しました"); closeOverlay(); }
    }catch(e){ btn.disabled=false; btn.textContent="この内容で実行する"; err.innerHTML='<div class="err">処理できませんでした。</div>'; }
  });

/* ============================================================
   VIEW: 営業会議（毎週）
   ① 打合わせシート（お客様ごとのゴールと今週やること）→ ② 数字 → ③ 今週の動き → ④ 議事録・宿題
   ============================================================ */
const FORECAST = {
  hi: {mark:"◎", label:"確度高", desc:"予定月に契約できる見込み"},
  mid:{mark:"○", label:"確度中", desc:"五分五分"},
  lo: {mark:"△", label:"確度低", desc:"可能性はある"},
};
const FC_ORDER = {hi:0, mid:1, lo:2, "":3};
const MTG_TABS = [["sheet","① 打合わせシート"],["nums","② 数字"],["moves","③ 今週の動き"],["notes","④ 議事録・宿題"]];
const thisMonth = () => TODAY().slice(0,7);
function monthLabel(ym){ const p=String(ym||"").split("-").map(Number); return p[0]? p[0]+"年"+p[1]+"月" : "—"; }
const arr = v => Array.isArray(v) ? v : [];
function fcMark(k){ return FORECAST[k]? '<span class="fc '+k+'" title="'+esc(FORECAST[k].label)+'">'+FORECAST[k].mark+'</span>' : '<span class="faint">—</span>'; }
function expAmt(c){ const v=(c.expectedAmount!==""&&c.expectedAmount!=null)? c.expectedAmount : c.budgetTotal; return num(v); }

/* ---------- 目標 ---------- */
const goalId = (ym,cid,sid) => ym+"_"+cid+"_"+sid;
function goalSum(ym, sid){
  const cs = scopeCompanies();
  return goals.filter(g=>g.month===ym && cs.includes(g.companyId) && (!sid || g.staffId===sid))
    .reduce((a,g)=>({units:a.units+num(g.units), amount:a.amount+num(g.amount)}), {units:0, amount:0});
}
/* その月の契約実績と見込み（list は対象のお客様） */
function monthNumbers(ym, list){
  const won = list.filter(c=>c.contracted && String(c.contractDate||"").startsWith(ym));
  const act = list.filter(c=>!c.contracted && !c.lost && c.expectedMonth===ym);
  const by = k => act.filter(c=>c.forecast===k);
  const sum = (l,f) => l.reduce((s,c)=>s+f(c),0);
  return {
    won:won.length, wonAmt:sum(won,c=>num(c.contractAmount)),
    hi:by("hi").length, hiAmt:sum(by("hi"),expAmt),
    mid:by("mid").length, midAmt:sum(by("mid"),expAmt),
    lo:by("lo").length, loAmt:sum(by("lo"),expAmt),
  };
}

/* ---------- 会議の記録 ---------- */
let mtgDraft = null;
const mtgsInScope = () => sortBy(mtgs.filter(m=>(m.scope||"all")===ui.scope), m=>m.date||"", "desc");
function newMtgDraft(){
  const today = mtgsInScope().find(m=>m.date===TODAY());
  if(today) return loadMtgDraft(today);
  return { id:null, scope:ui.scope, date:TODAY(), month:ui.mtgMonth||thisMonth(),
    attendees:scopeStaff().map(s=>s.id), notes:"", actions:[], minutes:null, snapshot:null, createdBy:"" };
}
function loadMtgDraft(m){
  return { id:m.id, scope:m.scope||"all", date:m.date||TODAY(), month:m.month||thisMonth(),
    attendees:arr(m.attendees).slice(), notes:m.notes||"", actions:arr(m.actions).map(a=>({...a})),
    minutes:m.minutes||null, snapshot:m.snapshot||null, createdBy:m.createdBy||"" };
}
function ensureDraft(){
  if(!ui.mtgMonth) ui.mtgMonth = thisMonth();
  if(!mtgDraft || mtgDraft.scope!==ui.scope){ mtgDraft = newMtgDraft(); ui.mtgMonth = mtgDraft.month; }
  return mtgDraft;
}
/* 集計期間：前回の会議の翌日〜今回の会議日（前回が無ければ直近7日） */
function mtgPeriod(d){
  const prev = mtgsInScope().find(m=>m.id!==d.id && (m.date||"") < d.date);
  const base = parseD(d.date) || new Date();
  const start = prev ? prev.date : isoDate(new Date(base.getFullYear(), base.getMonth(), base.getDate()-7));
  return {start, end:d.date, prev:prev||null};
}
const inPeriod = (s,p) => !!s && s > p.start && s <= p.end;
function buildSnapshot(ym){
  const list = scoped(), reps = {};
  mtgReps().forEach(s=>{
    const mine = list.filter(c=>c.ownerId===s.id);
    const pipe = {};
    STAGES.forEach(st=>{ pipe[st.id] = mine.filter(c=>!c.lost && !c.contracted && c.stage===st.id).length; });
    reps[s.id] = {name:s.name, goal:goalSum(ym,s.id).units, ...monthNumbers(ym,mine), pipe};
  });
  const g = goalSum(ym, ui.scopeRep||"");
  return {month:ym, total:{goal:g.units, goalAmt:g.amount, ...monthNumbers(ym,list)}, reps};
}

const weekKey = s => { const d=parseD(s)||new Date(); const w=(d.getDay()+6)%7; return isoDate(new Date(d.getFullYear(), d.getMonth(), d.getDate()-w)); };
function goalLeft(c){
  if(!c.goalDate) return '<span class="gl none">目標日を決める</span>';
  const d = daysFrom(c.goalDate);
  if(d===null) return '';
  if(d<0) return '<span class="gl over">'+(-d)+'日過ぎ</span>';
  if(d<7) return '<span class="gl soon">あと'+d+'日</span>';
  return '<span class="gl">あと'+Math.ceil(d/7)+'週</span>';
}

/* 週ごとの記録：タブで週を切り替え、その週の「やること」「結果・進捗」「できた」を書く */
const cardWeek = {};
const cardExtra = {};  /* 「＋」で足した、まだ何も書いていない先の週 */   /* カードごとに選んでいる週（画面を開いている間だけ覚える） */
const addDays = (s,n) => { const d=parseD(s); return isoDate(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n)); };
const md = s => { const d=parseD(s); return d? (d.getMonth()+1)+"/"+d.getDate() : ""; };
function weekRange(k){ return fmtD(k)+"〜"+fmtD(addDays(k,6)); }
function weekState(c, k, cur){
  const x = (c.weekly||{})[k] || {};
  if(x.done) return "ok";
  if(k < cur && (x.plan||x.result)) return "ng";
  return x.plan||x.result ? "wip" : "";
}
function weekHTML(c, cur){
  const next = addDays(cur, 7);
  const keys = [...new Set(Object.keys(c.weekly||{}).filter(k=>{ const x=c.weekly[k]||{}; return k<cur && (x.plan||x.result); }))].sort().slice(-5);
  const future = Object.keys(c.weekly||{}).filter(k=>{ const x=c.weekly[k]||{}; return k>cur && (x.plan||x.result||x.done); });
  const tabs = [...new Set(keys.concat([cur, next], future, cardExtra[c.id]||[]))].sort();
  const sel = tabs.includes(cardWeek[c.id]) ? cardWeek[c.id] : cur;
  const x = (c.weekly||{})[sel] || {};
  const past = tabs.filter(k=>k<cur), okN = past.filter(k=>((c.weekly||{})[k]||{}).done).length;
  const tag = k => k===cur ? "今週" : k===next ? "来週" : "";
  return '<div class="sc-sec wk"><div class="sc-lbl">毎週の記録'+(past.length? '<span class="faint">（これまで '+past.length+'週中 '+okN+'週できた）</span>':'')+'</div>'+
    '<div class="wk-tabs">'+tabs.map(k=>{ const st=weekState(c,k,cur);
      return '<button type="button" class="wk-tab'+(k===sel?" on":"")+(st?" "+st:"")+'" data-wtab="'+c.id+'|'+k+'" title="'+esc(weekRange(k))+'">'+
        (tag(k)? '<b>'+tag(k)+'</b>':'')+esc(md(k))+(st==="ok"?' ✓':st==="ng"?' ×':'')+'</button>'; }).join("")+
      '<button type="button" class="wk-tab wk-add" data-wadd="'+c.id+'|'+addDays(tabs[tabs.length-1],7)+'" title="さらに先の週を足す">＋</button></div>'+
    '<div class="wk-body">'+
      '<div class="wk-title"><span>'+esc(weekRange(sel))+'</span>'+(tag(sel)? '<span class="wk-now">'+tag(sel)+'</span>':'')+
        '<label class="wk-done"><input type="checkbox" data-wdone="'+c.id+'|'+sel+'"'+(x.done?" checked":"")+'>できた</label></div>'+
      '<label class="sc-lbl">やること</label>'+
      '<textarea class="sc-plan" data-wplan="'+c.id+'|'+sel+'" rows="2" placeholder="例：資金計画書を持って訪問し、事前審査の書類をもらう">'+esc(x.plan||"")+'</textarea>'+
      '<label class="sc-lbl">結果・進捗</label>'+
      '<textarea class="sc-plan sc-res" data-wres="'+c.id+'|'+sel+'" rows="2" placeholder="例：審査書類を回収。10/10に銀行へ提出予定">'+esc(x.result||"")+'</textarea>'+
      (c.path? '<details class="more"><summary>以前の「契約までの道筋」メモ</summary><div class="htx tiny">'+esc(c.path)+'</div></details>':'')+
    '</div></div>';
}

/* 詳細パネルの中の入力を保存する（保存したら repaint で描き直す） */
function bindDetail(root, wk, repaint){
  const later = () => setTimeout(repaint, 350);
  root.querySelectorAll("[data-gd]").forEach(el=>el.addEventListener("change",()=>
    quickUpdate(el.dataset.gd, {goalDate:el.value, expectedMonth:el.value? el.value.slice(0,7) : ""}).then(later)));
  root.querySelectorAll("[data-yf]").forEach(el=>el.addEventListener("change",()=>quickUpdate(el.dataset.yf,{forecast:el.value}).then(later)));
  root.querySelectorAll("[data-apd]").forEach(el=>el.addEventListener("change",()=>
    quickUpdate(el.dataset.apd, el.value? {applied:true, appliedDate:el.value} : {applied:false, appliedDate:""}).then(later)));
  root.querySelectorAll("[data-apclr]").forEach(b=>b.addEventListener("click",()=>
    quickUpdate(b.dataset.apclr, {applied:false, appliedDate:""}).then(later)));
  const saveWeek = (key, patch) => {
    const [cid, k] = key.split("|"); const c = customers.find(x=>x.id===cid); if(!c) return Promise.resolve();
    const weekly = {...(c.weekly||{})}; weekly[k] = {...(weekly[k]||{}), ...patch};
    return quickUpdate(cid, {weekly});
  };
  root.querySelectorAll("[data-wplan]").forEach(el=>el.addEventListener("change",()=>saveWeek(el.dataset.wplan, {plan:el.value.trim()})));
  root.querySelectorAll("[data-wres]").forEach(el=>el.addEventListener("change",()=>saveWeek(el.dataset.wres, {result:el.value.trim()})));
  root.querySelectorAll("[data-wdone]").forEach(el=>el.addEventListener("change",()=>saveWeek(el.dataset.wdone, {done:el.checked}).then(later)));
  root.querySelectorAll("[data-wadd]").forEach(b=>b.addEventListener("click",()=>{
    const [cid, k] = b.dataset.wadd.split("|");
    cardExtra[cid] = (cardExtra[cid]||[]).concat([k]); cardWeek[cid] = k; setTimeout(repaint, 0);
  }));
  root.querySelectorAll("[data-wtab]").forEach(b=>b.addEventListener("click",()=>{
    const [cid, k] = b.dataset.wtab.split("|"); cardWeek[cid] = k;
    setTimeout(repaint, 250);   /* 書きかけの欄の保存（change）を先に済ませる */
  }));
  root.querySelectorAll("[data-cmsend]").forEach(b=>b.addEventListener("click",()=>{
    const inp = root.querySelector('[data-cm="'+b.dataset.cmsend+'"]'); if(!inp || !inp.value.trim()) return;
    const t = inp.value; inp.value = ""; addComment(b.dataset.cmsend, t).then(later);
  }));
  root.querySelectorAll("[data-cm]").forEach(el=>el.addEventListener("keydown",e=>{
    if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); const t=el.value; if(!t.trim()) return; el.value=""; addComment(el.dataset.cm, t).then(later); }
  }));
  root.querySelectorAll("[data-cmdel]").forEach(b=>b.addEventListener("click", async ()=>{
    const [cid, id] = b.dataset.cmdel.split("|"); const c = customers.find(x=>x.id===cid); if(!c) return;
    if(!await askConfirm("コメントを消す","このコメントを消します。","消す",true)) return;
    quickUpdate(cid, {comments: arr(c.comments).filter(m=>m.id!==id)}).then(later);
  }));
}

/* ---------- 郵便番号 → 住所 ---------- */
let zipLoading = null;
function loadZip(){
  if(window.__ZIP) return Promise.resolve(window.__ZIP);
  if(zipLoading) return zipLoading;
  zipLoading = new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = "zip-jp.js"; s.async = true;
    s.onload = ()=> window.__ZIP ? res(window.__ZIP) : (zipLoading=null, rej());
    s.onerror = ()=>{ zipLoading = null; s.remove(); rej(); };
    document.head.appendChild(s);
  });
  return zipLoading;
}
/* 郵便番号の欄に7桁そろったら、住所の欄に町名まで入れる */
function bindZip(zipEl, addrEl, withPref){
  if(!zipEl || !addrEl) return;
  const note = document.createElement("div"); note.className = "tiny faint zipnote"; zipEl.insertAdjacentElement("afterend", note);
  let last = "";
  zipEl.addEventListener("input", async ()=>{
    const code = String(zipEl.value||"").normalize("NFKC").replace(/\D/g,"");
    if(code.length!==7 || code===last) { if(code.length<7) note.textContent=""; return; }
    last = code; note.textContent = "住所を探しています…";
    let Z; try{ Z = await loadZip(); }catch(e){ note.textContent = "住所の表を読み込めませんでした。住所は手で入力してください。"; return; }
    const r = Z.z[code];
    if(!r){ note.textContent = "この郵便番号は見つかりませんでした。"; return; }
    const [pref, city] = Z.c[r[0]], towns = r.slice(1);
    const put = t => {
      const a = (withPref? pref : "")+city+(t||"");
      if(!addrEl.value.trim().startsWith(a)) addrEl.value = a;   /* すでに番地まで入っていれば残す */
      note.textContent = "番地を続けて入力してください";
      addrEl.focus(); const n=addrEl.value.length; try{ addrEl.setSelectionRange(n,n); }catch(e){}
    };
    if(towns.length>1){
      note.innerHTML = '町名を選んでください：'+towns.map((t,i)=>'<button type="button" class="linkbtn" data-town="'+i+'" style="margin-left:6px">'+esc(t)+'</button>').join("");
      note.querySelectorAll("[data-town]").forEach(b=>b.addEventListener("click",()=>put(towns[Number(b.dataset.town)])));
      put("");
    } else put(towns[0]||"");
  });
}

  let h = '';

  /* 目標バー */

  h += '<div class="panel" style="margin-top:14px"><header><h3>'+esc(monthLabel(ym))+' の積み上がり</h3></header><div class="pad">'+
    '<div class="gwrap"><div class="gbar">'+
      (n.won? '<span class="w" style="width:'+pct(n.won)+'"></span>':'')+

    '</div></div>'+
    '<div class="glegend"><span><i style="background:var(--ok)"></i>契約済 '+n.won+'</span>'+

      '<span><i style="background:color-mix(in srgb,var(--accent) 40%,var(--surface3))"></i>○ '+n.mid+'</span>'+
      '<span>△ '+n.lo+'（バーには含めていません）</span></div></div></div>';
  /* 担当者別 */
  const reps = mtgReps();
  const rows = reps.map(s=>{
    const mine = list.filter(c=>c.ownerId===s.id);
    const x = monthNumbers(ym, mine), goal = goalSum(ym, s.id).units, land = x.won + x.hi;
    const met = mine.reduce((t,c)=>t+meetingsOf(c).filter(m=>meetingDone(m) && inPeriod(m.date,per)).length, 0);
    const fol = mine.filter(needsFollow).length;
    const ps = prevSnap && prevSnap.reps ? prevSnap.reps[s.id] : null;
    const dl = (cur,old) => { if(!ps) return ''; const v=cur-num(old); return v? '<span class="delta '+(v>0?"p":"n")+'">'+(v>0?"+":"")+v+'</span>' : ''; };
    const gap = goal ? goal - land : null;

/* 一覧から直接1項目だけ書き換える（他の人の編集を上書きしない） */
async function quickUpdate(cid, patch){
  const c = customers.find(x=>x.id===cid); if(!c) return;
  if(!canEditCustomer(c)) return toast("このお客様は編集できません");
  const doc = {...patch, updatedAt:new Date().toISOString()};
  if(patch.stage && patch.stage!==c.stage) doc.stageLog = arr(c.stageLog).concat([{stage:patch.stage, date:TODAY(), by:me.name||""}]);
  try{ await DB.doc("customers/"+cid).update(doc); toast("保存しました"); }
  catch(e){ toast("保存できませんでした"); }
}

function mtgMoves(box, d, per){
  const all = scoped();

    '<span class="grow" style="min-width:0"><div class="cname" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.name||"（無名）")+'</div>'+

    '<span class="chip">'+n+'件</span></header><div>'+(body||'<div class="empty">ありません</div>')+'</div></div>';

  const lost = all.filter(c=>c.lost && inPeriod(c.lostDate, per));
  const fresh = all.filter(c=>inPeriod(c.inquiryDate, per));
  const adv = [];
  all.forEach(c=>arr(c.stageLog).forEach(x=>{ if(inPeriod(x.date, per) && arr(c.stageLog)[0]!==x) adv.push({c, x}); }));
  const met = [];
  all.forEach(c=>meetingsOf(c).forEach(m=>{ if(meetingDone(m) && inPeriod(m.date, per)) met.push({c, m}); }));
  const nextWeek = upcomingList().filter(({m})=>{ const x=daysFrom(m.date); return x!==null && x>=0 && x<=7; });
  let h = '<div class="panels">';
  h += panel("契約", won.length, won.map(c=>rowC(c, man(c.contractAmount)+" 万円")).join(""), "var(--ok)");
  h += panel("工程が進んだ", adv.length, sortBy(adv, a=>a.x.date, "desc").map(a=>rowC(a.c, "→ "+esc(STAGE_NAME[a.x.stage]||a.x.stage)+"　"+esc(fmtD(a.x.date)))).join(""));
  h += panel("新しい反響", fresh.length, fresh.map(c=>rowC(c, esc(c.source||"")+"　"+esc(fmtD(c.inquiryDate)))).join(""));
  h += panel("実施した面談", met.length, sortBy(met, a=>a.m.date, "desc").map(a=>rowC(a.c, esc(a.m.n)+"　"+esc(fmtD(a.m.date)))).join(""));
  h += panel("没", lost.length, lost.map(c=>rowC(c, esc(c.lostReason||"理由なし"))).join(""), "var(--muted)");
  h += panel("これから7日の面談", nextWeek.length, nextWeek.map(({c,m})=>rowC(c, esc(m.n)+"　"+esc(fmtD(m.date))+(m.time? " "+esc(m.time):""))).join(""), "var(--accent)");
  h += '</div>';
  box.innerHTML = h;
  box.querySelectorAll("[data-cust]").forEach(el=>el.addEventListener("click",()=>openCustomer(el.dataset.cust)));
}

let SAMPLE = null;
async function initSample(){
  try{ SAMPLE = await window.claude.use("sample"); }catch(e){ SAMPLE = null; }
  if(SAMPLE && view==="mtg" && ui.mtgTab==="notes"){ const r=$("#viewRoot"); if(r) renderMtg(r); }
